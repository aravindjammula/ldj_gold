# example netlify.toml
[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file


### **2. Add Repository Metadata**
In the repo **settings or GitHub UI**:
- Add a **description**
- Add **topics** (e.g., `react`, `vite`, `jewelry-website`, `webp`, `seo`)

This improves discoverability.

---

### **3. Add License**
Include a license (e.g., MIT) by creating `LICENSE` so others can legally reuse your code.

---

### **4. Version Control Best Practices**
- Use meaningful commit messages
- Tag releases (e.g., `v1.0.0`)
- Protect main branch if collaborating

---

### **5. Add Screenshots + Demo**
Adding images or a hosted demo link (your live site) boosts clarity for visitors.

---

## 📌 **SEO / GitHub Specific Enhancements**
To show GitHub Pages traffic details:
- Add a **GitHub Action badge** (build/test status)
- Add a **code coverage badge** if applicable

---

