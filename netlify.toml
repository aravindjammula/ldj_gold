[build]
  command = "npm run build"
  publish = "dist"

# Allow SEO files (served as static files)
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# SPA routing (LAST rule)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
